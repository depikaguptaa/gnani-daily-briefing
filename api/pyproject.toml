[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnani-daily-briefing-api"
version = "0.1.0"
description = "Scheduled research-to-podcast API and worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["app*"]
