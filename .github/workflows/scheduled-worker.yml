name: Scheduled briefing worker

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-briefing-worker
  cancel-in-progress: false

jobs:
  process-due-briefing:
    if: ${{ vars.ENABLE_SCHEDULED_WORKER == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUDIO_BUCKET: episodes
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      GNANI_API_KEY: ${{ secrets.GNANI_API_KEY }}
      GNANI_MODEL: timbre-v3.0
      GNANI_VOICE: Shivani
      GNANI_LANGUAGE: en-IN
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.2
          uv sync --locked --no-dev
      - name: Process one scheduler cycle
        run: uv run python -m app.worker --once
